name: Build Android Release APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Sherpa-ONNX AAR is Present
        run: |
          mkdir -p app/libs
          AAR_PATH="app/libs/sherpa-onnx-static-link-onnxruntime-1.13.8.aar"
          if [ ! -f "$AAR_PATH" ] || [ $(wc -c < "$AAR_PATH") -lt 1000000 ]; then
            echo "Downloading sherpa-onnx-static-link-onnxruntime-1.13.8.aar..."
            curl -L -o "$AAR_PATH" "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-static-link-onnxruntime-1.13.8.aar"
          else
            echo "Sherpa-ONNX AAR is already present in repository."
          fi

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK for Distribution
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Chronicle-NewsFeed-Release.apk
          ls -lh dist/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chronicle-NewsFeed-Release-APK
          path: dist/Chronicle-NewsFeed-Release.apk
          retention-days: 30

      - name: Create GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Chronicle-NewsFeed-Release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
